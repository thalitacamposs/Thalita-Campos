<script>
/* Painel no GitHub Pages: banco de dados no Supabase (substitui o banco do Claude) */
(function(){
  const SB='https://lrnbioyhpushvgvygazi.supabase.co', KEY='sb_publishable_o_zAGczDlaRpgtetppsf4A_oVddFCFv', LS='painel-sb-sessao';
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const deep=(a,b)=>{if(!a||typeof a!=='object'||Array.isArray(a))return clone(b);const o=Object.assign({},a);for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?deep(o[k],v):clone(v)}return o};
  let ses=null; try{ses=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
  /* volta do link mágico: #access_token=... */
  try{const h=new URLSearchParams(location.hash.slice(1));if(h.get('access_token')){ses={access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_at:Math.floor(Date.now()/1000)+(+h.get('expires_in')||3600)};localStorage.setItem(LS,JSON.stringify(ses));history.replaceState(null,'',location.pathname+location.search)}
    else if(h.get('error_description')){window.__sbErr=h.get('error_description');history.replaceState(null,'',location.pathname+location.search)}}catch(e){}
  async function token(){
    if(!ses)return null;
    if(ses.expires_at-60>Date.now()/1000)return ses.access_token;
    const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:ses.refresh_token})});
    if(!r.ok){ses=null;try{localStorage.removeItem(LS)}catch(e){}return null}
    const j=await r.json();ses={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};try{localStorage.setItem(LS,JSON.stringify(ses))}catch(e){}
    return ses.access_token}
  async function api(path,opt){const t=await token();if(!t)throw {code:'sem_login'};opt=opt||{};
    const r=await fetch(SB+path,Object.assign({},opt,{headers:Object.assign({apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},opt.headers||{})}));
    if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw {code:'http_'+r.status,message:m}}
    const tx=await r.text();return tx?JSON.parse(tx):null}
  let uid=null,cache={},subs={},q=Promise.resolve(),pend=0,lastSaved='';
  const snap=p=>({exists:cache[p]!=null,id:p.split('/').pop(),metadata:{fromCache:false,hasPendingWrites:false},data:()=>clone(cache[p])});
  const deliver=p=>(subs[p]||[]).forEach(f=>{try{f(snap(p))}catch(e){}});
  async function load(){const rows=await api('/rest/v1/painel?select=dados,atualizado&user_id=eq.'+uid);const r=rows&&rows[0];cache=(r&&r.dados)||{};lastSaved=r?r.atualizado:'';return !!r}
  function write(mut){const p=q.then(async()=>{pend++;try{mut(cache);const at=new Date().toISOString();
      await api('/rest/v1/painel?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:uid,dados:cache,atualizado:at})});lastSaved=at}finally{pend--}});
    q=p.catch(()=>{});return p}
  /* outro aparelho: confere a cada 20 s */
  setInterval(async()=>{if(!uid||pend||document.visibilityState==='hidden')return;try{const rows=await api('/rest/v1/painel?select=dados,atualizado&user_id=eq.'+uid);const r=rows&&rows[0];if(!r||r.atualizado===lastSaved||pend)return;
    const old=cache;cache=r.dados||{};lastSaved=r.atualizado;new Set(Object.keys(old).concat(Object.keys(cache))).forEach(k=>{if(JSON.stringify(old[k])!==JSON.stringify(cache[k]))deliver(k)})}catch(e){}},20000);
  const dbApi={doc:path=>({id:path.split('/').pop(),path,
    get:async()=>snap(path),
    set:d=>path==='painel/diag'?Promise.resolve():write(c=>{c[path]=clone(d)}).then(()=>deliver(path)),
    update:d=>path==='painel/diag'?Promise.resolve():(cache[path]==null?Promise.reject({code:'invalid_argument'}):write(c=>{c[path]=deep(c[path],d)}).then(()=>deliver(path))),
    delete:()=>write(c=>{delete c[path]}).then(()=>deliver(path)),
    onSnapshot:(f)=>{(subs[path]=subs[path]||[]).push(f);setTimeout(()=>f(snap(path)),0);return()=>{subs[path]=(subs[path]||[]).filter(x=>x!==f)}}})};
  let ok;const ready=new Promise(r=>ok=r);
  window.claude={use:async n=>{if(n==='db'){await ready;return dbApi}return null}};
  /* tela de entrada */
  const css=`#sbgate{position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg,#fbf7fb) 92%,transparent);backdrop-filter:blur(6px);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  #sbgate .bx{width:min(420px,100%);background:var(--surface,#fff);color:var(--ink,#2b2433);border:1px solid var(--line,#e6dbeb);border-radius:22px;padding:22px;display:grid;gap:12px;box-shadow:0 10px 40px rgba(60,30,90,.12)}
  #sbgate h2{margin:0;font-size:21px}#sbgate p{margin:0;font-size:14px;line-height:1.45;color:var(--muted,#6b6075)}
  #sbgate input[type=email]{min-height:48px;border-radius:14px;border:1.5px solid var(--line,#e6dbeb);padding:0 14px;font-size:16px;background:var(--surface,#fff);color:inherit}
  #sbgate button,#sbgate label.b{min-height:48px;border-radius:14px;border:0;background:#8a5cc2;color:#fff;font-weight:700;font-size:15px;cursor:pointer;display:grid;place-items:center}
  #sbgate .sec{background:transparent;color:#8a5cc2;border:1.5px solid #8a5cc2}#sbgate .err{color:#c2415a;font-weight:600}`;
  function gate(html){let g=document.getElementById('sbgate');if(!g){const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);g=document.createElement('div');g.id='sbgate';document.body.appendChild(g)}g.innerHTML='<div class="bx">'+html+'</div>';return g}
  function closeGate(){const g=document.getElementById('sbgate');if(g)g.remove()}
  function askLogin(msg){const g=gate(`<h2>Thalita’s time on earth</h2><p>Entre com o seu e-mail. Você recebe um link para abrir o painel, sem senha.</p>${msg?'<p class="err">'+msg+'</p>':''}<input type="email" id="sbmail" placeholder="seu e-mail" autocomplete="email"><button type="button" id="sbgo">Receber link de acesso</button>`);
    const go=async()=>{const em=g.querySelector('#sbmail').value.trim();if(!em)return;const b=g.querySelector('#sbgo');b.disabled=true;b.textContent='Enviando…';
      try{const r=await fetch(SB+'/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em,create_user:true})});
        if(!r.ok){let m='';try{const j=await r.json();m=j.msg||j.message||j.error_description||''}catch(e){}throw new Error(m||('erro '+r.status))}
        gate(`<h2>Confira o seu e-mail</h2><p>Mandei um link para <b>${em.replace(/</g,'&lt;')}</b>. Abra o link <b>neste mesmo aparelho e navegador</b> para entrar.</p><button type="button" class="sec" onclick="location.reload()">Já abri o link</button>`)}
      catch(e){askLogin('Não consegui enviar: '+e.message)}};
    g.querySelector('#sbgo').onclick=go;g.querySelector('#sbmail').onkeydown=e=>{if(e.key==='Enter')go()}}
  function askImport(){const g=gate(`<h2>Primeiro acesso</h2><p>O banco está vazio. Escolha o arquivo <b>painel-dados.json</b> que a Claude te enviou para trazer tudo o que estava salvo no link do Claude.</p><label class="b">Importar meus dados<input type="file" id="sbfile" accept=".json,application/json" hidden></label><button type="button" class="sec" id="sbzero">Começar do zero</button><p id="sbmsg"></p>`);
    g.querySelector('#sbfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j['painel/estado'])throw new Error('arquivo sem os dados do painel');
        await write(c=>{Object.keys(j).forEach(k=>c[k]=j[k])});closeGate();ok()}catch(err){g.querySelector('#sbmsg').innerHTML='<span class="err">Não importou: '+(err.message||err.code)+'</span>'}};
    g.querySelector('#sbzero').onclick=()=>{closeGate();ok()}}
  async function start(){
    try{const t=await token();if(!t){askLogin(window.__sbErr?('O link expirou ou já foi usado. Peça outro.'):'');return}
      const u=await api('/auth/v1/user');uid=u.id;const has=await load();
      if(!has||!cache['painel/estado'])askImport();else ok()}
    catch(e){if(e&&e.code==='sem_login')askLogin('');else gate(`<h2>Sem conexão com o banco</h2><p class="err">${(e&&(e.message||e.code))||'erro'}</p><button type="button" onclick="location.reload()">Tentar de novo</button>`)}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
  window.__sair=()=>{try{localStorage.removeItem(LS)}catch(e){}location.reload()};
})();
</script>

<title>Thalita’s time on earth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Caveat:wght@500;700&family=Special+Elite&display=swap">
<style>
/* Layout: título brilhante com estrelinhas, menu de pílulas fixo, um pilar por vez em cartões arredondados (2 colunas no desktop).
   Brilho só no cabeçalho, no versículo do dia e na faixa de consistência. Vermelho reservado para estouro de teto. */
:root{
  --bg:#FFF0F6; --surface:#FFFFFF; --surface2:#FCE6F0; --ink:#412A4C; --muted:#86709A; --line:#F3D5E4;
  --c-saude:#F06BA6; --c-sono:#B49CF0; --c-mente:#8C67D9; --c-estudo:#F4A261; --c-fin:#D6528F; --c-carr:#9A93B5; --c-bel:#E48AD2; --c-leit:#8FA6E8; --c-teo:#E3A94F;
  --good:#3C9C84; --warn:#EE8A2B; --bad:#D6304E; --spark:#FFFFFF; --pos:#9BDBB8;
  --c-bio:#E58FC4; --c-freq:#F27FA8; --c-via:#6FBFC8; --c-cul:#B88BE0; --c-dois:#F2788F; --vs-gold:#B8924F; --vs-blush:#FDE9EF;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#231428; --surface:#301C39; --surface2:#3B2446; --ink:#F9E9F4; --muted:#BDA4CC; --line:#4A3057;
  --good:#5CC7A8; --warn:#F5A24A; --bad:#FF6B86; --pos:#7FCBA3; --vs-gold:#D9B77A; --vs-blush:#3D2433; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#231428; --surface:#301C39; --surface2:#3B2446; --ink:#F9E9F4; --muted:#BDA4CC; --line:#4A3057;
  --good:#5CC7A8; --warn:#F5A24A; --bad:#FF6B86; --pos:#7FCBA3; --vs-gold:#D9B77A; --vs-blush:#3D2433; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:8px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(60% 40% at 90% -5%,color-mix(in srgb,var(--c-saude) 22%,transparent),transparent),radial-gradient(50% 35% at -5% 20%,color-mix(in srgb,var(--c-sono) 22%,transparent),transparent);
  background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:980px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--c-mente);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:20px 0 8px;flex-wrap:wrap;position:relative}
.top h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(42px,10vw,64px);line-height:1.02;margin:0;
  background:linear-gradient(100deg,var(--c-saude),var(--c-mente) 30%,var(--c-estudo) 52%,var(--c-saude) 75%,var(--c-mente));background-size:240% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.top p{margin:6px 0 0;color:var(--muted);text-transform:capitalize}
.stars{position:absolute;right:4px;top:6px;width:84px;height:64px;pointer-events:none}
.stars svg{position:absolute;animation:twinkle 2.6s ease-in-out infinite alternate}
.chip{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--surface)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 0 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted)}
nav button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
nav button[aria-current="true"]{background:color-mix(in srgb,var(--c) 26%,var(--surface));color:var(--ink);border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--muted));margin:8px 0 4px}
h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(30px,6.5vw,42px);line-height:1.08;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:700}
.card .sub{margin:2px 0 12px;color:var(--muted);font-size:12.5px}
.card.wide{grid-column:1/-1}
.glit{position:relative;overflow:hidden;isolation:isolate}
.glit::before,.glit::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 12% 22%,var(--spark) 98%,transparent),radial-gradient(1px 1px at 34% 72%,var(--spark) 98%,transparent),radial-gradient(1.7px 1.7px at 58% 18%,var(--spark) 98%,transparent),radial-gradient(1.2px 1.2px at 77% 64%,var(--spark) 98%,transparent),radial-gradient(1px 1px at 91% 28%,var(--spark) 98%,transparent),radial-gradient(1.4px 1.4px at 45% 90%,var(--spark) 98%,transparent),radial-gradient(1.2px 1.2px at 6% 80%,var(--spark) 98%,transparent),radial-gradient(1.6px 1.6px at 68% 44%,var(--spark) 98%,transparent);
  animation:twinkle 3.2s ease-in-out infinite alternate}
.glit::after{transform:translate(9px,13px) scaleX(-1);animation-delay:-1.6s;opacity:.7}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--c-saude) 38%,var(--surface)),color-mix(in srgb,var(--c-mente) 34%,var(--surface)));border:1px solid var(--line);border-radius:26px;padding:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero b{font-family:var(--display);font-style:italic;font-weight:600;font-size:76px;line-height:.9}
.hero span{color:var(--ink);opacity:.8}
.verse{background:linear-gradient(135deg,color-mix(in srgb,var(--c-estudo) 26%,var(--surface)),color-mix(in srgb,var(--c-saude) 26%,var(--surface)));border:1px solid var(--line);border-radius:24px;padding:18px 20px;margin-bottom:14px}
.verse q{display:block;font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(19px,4.2vw,25px);line-height:1.3;quotes:none;text-wrap:balance}
.verse cite{display:block;margin-top:8px;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;min-width:0}
.mini:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.mini .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:flex;justify-content:space-between;gap:8px}
.mini .v{font-weight:700;font-size:15px}
.ok{color:var(--good)}.no{color:var(--muted)}
.bar{height:9px;border-radius:99px;background:color-mix(in srgb,var(--c) 17%,var(--surface));overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.bar.warn i{background:var(--bad)}
.bar.mid i{background:var(--warn)}
.row{display:flex;gap:8px;align-items:center}
.row.sb{justify-content:space-between}
.list{display:flex;flex-direction:column}
.item{display:grid;gap:6px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .t span:first-child{font-weight:600;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.red{color:var(--bad)}
input,textarea,select{width:100%;min-width:0;background:color-mix(in srgb,var(--c,var(--c-mente)) 9%,var(--surface));border:1px solid var(--line);border-radius:13px;padding:9px 11px}
textarea{resize:vertical;min-height:84px}
input[type=checkbox]{width:19px;height:19px;padding:0;accent-color:var(--c,var(--c-mente))}
.btn{flex:none;white-space:nowrap;padding:8px 14px;border-radius:13px;background:color-mix(in srgb,var(--c) 24%,var(--surface));font-weight:700;font-size:13px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line))}
.btn.ghost{background:none;border-color:var(--line);color:var(--muted);font-weight:600}
.x{flex:none;color:var(--muted);padding:2px 8px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{color:var(--bad)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.day i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.day.on{background:color-mix(in srgb,var(--c) 28%,var(--surface));border-color:var(--c);color:var(--ink)}
.day.on i{background:var(--c);border-color:var(--c)}
.day.today{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
.chart{position:relative;display:flex;align-items:flex-end;gap:4px;height:96px;margin-top:6px}
.chart .b{flex:1;border-radius:7px 7px 2px 2px;background:color-mix(in srgb,var(--c) 40%,var(--surface));min-height:3px}
.chart .b.hi{background:var(--c)}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.7}
.lbls{display:flex;gap:4px;margin-top:4px}
.lbls span{flex:1;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.big{font-family:var(--display);font-style:italic;font-size:44px;line-height:1.05}
.big small{font-family:var(--body);font-style:normal;font-size:13px;color:var(--muted);margin-left:6px}
.dots{display:flex;gap:6px}
.dots button{width:22px;height:22px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--line));background:none}
.dots button.on{background:var(--c);border-color:var(--c)}
.q{display:grid;gap:5px;margin-top:12px}
.q label{font-size:12.5px;font-weight:700}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0 2px}
.dual{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dual:first-child{border-top:0}
.dual .bars{display:grid;gap:4px}
.dual .bars .bar{height:7px}
.note{font-size:12.5px;color:var(--muted);margin:12px 0 0}
.wk{display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 28%,var(--surface));color:var(--ink);border-color:var(--c)}
.kan{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));margin-bottom:14px}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}

.vs{position:relative;overflow:hidden;isolation:isolate;border-radius:26px;padding:28px 20px;margin-bottom:14px;text-align:center;border:1px solid color-mix(in srgb,var(--vs-gold) 55%,var(--line));background:linear-gradient(160deg,var(--vs-blush),color-mix(in srgb,var(--c-bel) 22%,var(--vs-blush)) 55%,color-mix(in srgb,var(--vs-gold) 24%,var(--vs-blush)))}
.vs h2{font-family:'Cormorant Garamond',var(--display);font-style:italic;font-weight:600;letter-spacing:.01em;font-size:clamp(30px,7vw,46px);margin:6px 0 0}
.vs .gold{background:linear-gradient(100deg,var(--vs-gold),#EBCB8C 40%,var(--vs-gold) 70%,#D9B77A);-webkit-background-clip:text;background-clip:text;color:transparent}
.vs .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--vs-gold)}

.spk{position:absolute;z-index:-1;animation:twinkle 2.8s ease-in-out infinite alternate;pointer-events:none}

.cuid[aria-pressed="true"]{background:linear-gradient(160deg,color-mix(in srgb,var(--c-bel) 30%,var(--surface)),color-mix(in srgb,var(--vs-gold) 24%,var(--surface)));color:var(--ink);border-color:var(--vs-gold)}
.cuid[aria-pressed="true"] .ring{background:var(--vs-gold);color:#fff;border-color:var(--vs-gold)}
.enc{position:relative;overflow:hidden;isolation:isolate;border-radius:26px;padding:20px;margin-bottom:14px;border:1px solid var(--line);background:linear-gradient(145deg,color-mix(in srgb,var(--c-leit) 36%,var(--surface)),color-mix(in srgb,var(--c-mente) 26%,var(--surface)) 55%,color-mix(in srgb,var(--c-saude) 22%,var(--surface)))}
.enc .bk{position:absolute;z-index:-1;opacity:.5;filter:drop-shadow(0 3px 4px rgba(0,0,0,.12));pointer-events:none}
.pgbox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:8px 0 10px}

@media (prefers-reduced-motion:reduce){.spk{animation:none}.marq{white-space:normal}.marq-in{animation:none!important;padding:0 14px;display:block}}
@media (max-width:420px){.wrow{grid-template-columns:62px 40px 1fr 34px;padding:9px 10px}.pgbox .n{font-size:54px}}
@keyframes twinkle{from{opacity:.3}to{opacity:1}}
@keyframes shine{from{background-position:0 0}to{background-position:240% 0}}
@media (prefers-reduced-motion:reduce){.top h1,.glit::before,.glit::after,.stars svg{animation:none}}
@media (prefers-reduced-motion:no-preference){.bar i,.chart .b{transition:all .25s}}

/* ===== v6: identidade colagem católica pastel ===== */
:root{
  --bg:#FFF5F1; --surface:#FFFDFB; --surface2:#FBE8EE; --ink:#3F2A49; --muted:#85709A; --line:#F1D9E3;
  --c-mail:#7FB3E6; --c-casa:#F4A98A; --c-sage:#BFD9C6; --peach:#FFD9BF; --butter:#FFF0B8; --sky:#CFE3F5; --gold:#C49A45;
  --paper:#FFFBF6; --shadow:rgba(120,70,120,.22);
  --script:'Caveat','Segoe Script',cursive; --typew:'Special Elite','Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211326; --surface:#2E1B37; --paper:#33203D; --line:#4A3057; --gold:#E0BC78; --shadow:rgba(0,0,0,.45);
  --peach:#4A3030; --butter:#473F25; --sky:#243449; --c-sage:#2F4A3B}}
:root[data-theme="dark"]{
  --bg:#211326; --surface:#2E1B37; --paper:#33203D; --line:#4A3057; --gold:#E0BC78; --shadow:rgba(0,0,0,.45);
  --peach:#4A3030; --butter:#473F25; --sky:#243449; --c-sage:#2F4A3B}
body{background-image:
  radial-gradient(55% 38% at 92% -4%,color-mix(in srgb,var(--c-saude) 24%,transparent),transparent),
  radial-gradient(45% 34% at -6% 14%,color-mix(in srgb,var(--c-sono) 26%,transparent),transparent),
  radial-gradient(40% 30% at 100% 62%,color-mix(in srgb,var(--peach) 55%,transparent),transparent),
  radial-gradient(38% 28% at 0% 92%,color-mix(in srgb,var(--sky) 60%,transparent),transparent);
  background-attachment:fixed}
.card{box-shadow:0 10px 22px -16px var(--shadow);background:var(--paper)}
.mini{box-shadow:0 8px 18px -15px var(--shadow)}
.em{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-style:normal;line-height:1}

/* cabeçalho centralizado */
.top2{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;padding:18px 0 6px;position:relative}
.top2 .deco{display:flex;align-items:center;opacity:.95}
.top2 .deco.l{justify-content:flex-end}
.top2 .deco.r{justify-content:flex-start}
.top2 .mid{text-align:center;display:grid;justify-items:center;gap:4px;max-width:min(78vw,640px)}
.top2 .kick{font-family:var(--typew);font-size:11px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
.top2 h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(34px,8.6vw,62px);line-height:1.04;margin:0;text-wrap:balance;
  background:linear-gradient(100deg,var(--c-saude),var(--c-mente) 30%,var(--c-estudo) 52%,var(--c-saude) 75%,var(--c-mente));background-size:240% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.top2 .script{font-family:var(--script);font-size:clamp(18px,4.6vw,24px);color:var(--muted);line-height:1}
.top2 p{margin:2px 0 0;color:var(--muted);text-transform:none;font-size:13px}
.top2 .chip{margin-top:2px}
.top2 svg.s{width:clamp(34px,9vw,64px);height:auto;filter:drop-shadow(0 3px 5px var(--shadow))}
.top2 .fl{animation:flt 5s ease-in-out infinite alternate}
@keyframes flt{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-5px) rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.top2 h1,.top2 .fl{animation:none}}
@media (max-width:380px){.top2{grid-template-columns:1fr}.top2 .deco{display:none}}

/* menu com emoji */
nav{gap:7px;padding:8px 2px 12px}
nav button{padding:8px 14px 8px 11px;font-size:13.5px;box-shadow:0 5px 12px -10px var(--shadow)}
nav button .em{font-size:17px}
nav button i{display:none}
nav button[aria-current="true"]{box-shadow:0 7px 16px -9px color-mix(in srgb,var(--c) 70%,transparent)}
.tabs button .em,.chips button .em{margin-right:5px;font-size:14px}
.gtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px;padding:6px;border-radius:22px;background:color-mix(in srgb,var(--c-mente) 9%,var(--paper));border:1px dashed color-mix(in srgb,var(--c-mente) 35%,var(--line))}
.gtabs button{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:16px;border:1px solid transparent;font-weight:800;font-size:13.5px;color:var(--muted);background:transparent}
.gtabs button .em{font-size:18px}
.gtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:color-mix(in srgb,var(--c-mente) 45%,var(--line));box-shadow:0 6px 14px -9px var(--shadow)}

/* washi tape e cartões de papel */
.tape{position:relative}
.tape::after{content:"";position:absolute;top:-9px;left:50%;width:92px;height:20px;transform:translateX(-50%) rotate(-3deg);border-radius:3px;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c-saude) 45%,transparent) 0 7px,color-mix(in srgb,var(--surface) 55%,transparent) 7px 14px);box-shadow:0 2px 4px -2px var(--shadow)}
.tape.t2::after{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c-sono) 50%,transparent) 0 7px,color-mix(in srgb,var(--surface) 55%,transparent) 7px 14px);transform:translateX(-50%) rotate(2.5deg)}
.tape.t3::after{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c-estudo) 50%,transparent) 0 7px,color-mix(in srgb,var(--surface) 55%,transparent) 7px 14px)}
.today2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin:6px 0 16px}
.today2 article{position:relative;border-radius:24px;padding:22px 20px 18px;border:1px solid var(--line);box-shadow:0 12px 24px -16px var(--shadow);min-width:0}
.verse2{background:linear-gradient(150deg,color-mix(in srgb,var(--butter) 70%,var(--paper)),color-mix(in srgb,var(--c-saude) 18%,var(--paper)));transform:rotate(-.5deg)}
.saint2{background:linear-gradient(150deg,color-mix(in srgb,var(--sky) 70%,var(--paper)),color-mix(in srgb,var(--c-sono) 24%,var(--paper)));transform:rotate(.5deg)}
.today2 .kk{font-family:var(--typew);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px}
.today2 q{display:block;margin:8px 0 0;font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(19px,4.3vw,24px);line-height:1.32;quotes:none;text-wrap:balance}
.today2 cite{display:block;margin-top:10px;font-family:var(--script);font-style:normal;font-size:21px;color:var(--ink);opacity:.8}
.today2 .stk{position:absolute;right:12px;top:12px;opacity:.9;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.verse2,.saint2{transition:transform .25s}.verse2:hover,.saint2:hover{transform:rotate(0)}}

/* central de alertas */
.alertas{margin:0 0 16px;border-radius:24px;padding:16px;background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 24px -18px var(--shadow)}
.alertas h3{margin:0 0 2px;font-size:15px}
.al{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:16px;margin-top:8px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.al .t1{font-weight:700;font-size:13.5px}
.al .t2{font-size:12px;color:var(--muted)}
.al.x{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface));animation:pulso 1.8s ease-in-out infinite}
.al.x .t1{color:var(--bad);text-transform:uppercase;letter-spacing:.03em}
.al.a{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.al.a .t1{color:var(--bad)}
.al.i{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.al .go{flex:none;font-size:18px;opacity:.7}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 35%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.al.x{animation:none}}
.rotb{display:flex;gap:12px;align-items:center;margin:0 0 14px;padding:14px 16px;border-radius:22px;border:1px dashed color-mix(in srgb,var(--c-teo) 60%,var(--line));background:linear-gradient(120deg,color-mix(in srgb,var(--butter) 75%,var(--paper)),color-mix(in srgb,var(--c-saude) 12%,var(--paper)))}
.rotb .em{font-size:28px}
.rotb b{font-family:var(--display);font-style:italic;font-size:18px}
.prio{position:relative;border-radius:26px;padding:22px 20px 18px;margin-bottom:14px;border:2px solid var(--gold);background:linear-gradient(150deg,color-mix(in srgb,var(--butter) 80%,var(--paper)),color-mix(in srgb,var(--c-bel) 22%,var(--paper)));box-shadow:0 14px 26px -18px var(--shadow)}
.prio .rib{position:absolute;top:-12px;left:18px;background:var(--gold);color:#fff;font-family:var(--typew);font-size:11px;letter-spacing:.18em;padding:4px 14px 4px 12px;border-radius:4px 4px 4px 0}
.prio .big2{font-family:var(--display);font-style:italic;font-size:clamp(44px,12vw,66px);line-height:.95}
.prio h2{font-size:clamp(22px,5vw,30px);margin:6px 0 0}

/* carrossel de e-mail */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:thin}
.mc{flex:0 0 min(84%,310px);scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;min-width:0;box-shadow:0 10px 20px -16px var(--shadow);position:relative}
.mc.un::before{content:"";position:absolute;right:14px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--c-mail)}
.mc .fr{font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:18px}
.mc .sj{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.mc .sn{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mc a{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--c-mail)}
.cat{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--c-mail) 22%,var(--surface));align-self:flex-start}
.carnav{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px}
.chips button .n{opacity:.7;margin-left:4px;font-family:var(--mono);font-size:11px}

/* finanças contábil */

const canon=o=>Array.isArray(o)?'['+o.map(canon).join(',')+']':(o&&typeof o==='object')?'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}':JSON.stringify(o);
let UNDO=[];function undoPending(){const u=UNDO.splice(0);if(!u.length)return;u.reverse().forEach(f=>{try{f()}catch(e){}});render();dbg('desfeitas '+u.length+' alteração(ões) por falha');try{window.__toast&&window.__toast('Não consegui salvar no banco. Desfiz a última alteração na tela; tente de novo.')}catch(e){}}
const CID='c'+Math.random().toString(36).slice(2,8);let base=null,remote=null,synced=false,openedAt=Date.now();
function mergeRemote(){const r=remote;remote=null;if(!r)return;const bm=merge(clone(DEF),base||{});const out=merge(clone(DEF),r);let mine=0;
  for(const k of Object.keys(S)){if(k==='__ts'||k==='__by')continue;if(canon(S[k])!==canon(bm[k])){out[k]=S[k];mine++}}
  S=out;base=JSON.parse(JSON.stringify(r));lastRaw=canon(r);migrate();dbg('mesclado com outro aparelho ('+(r.__by||'?')+'), mantive '+mine+' parte(s) minhas')}
function acceptRemote(d){lastRaw=canon(d);base=JSON.parse(JSON.stringify(d));S=merge(clone(DEF),d);migrate();render();dbg('dados de outro aparelho aplicados ('+(d.__by||'?')+')')}
async function runSave(){
  clearTimeout(saveT);saveT=null;
  if(saving){saveT=setTimeout(runSave,300);return}
  if(ref&&!synced&&Date.now()-openedAt<8000){setStatus('carregando seus dados…');saveT=setTimeout(runSave,400);return}
  saving=true;lastSaveAt=Date.now();const seq=saveSeq;const t0=Date.now();dbg('gravando documento principal…');
  try{
    if(remote)mergeRemote();
    S.__ts=Date.now();S.__by=CID;myTs=S.__ts;const data=clone(S);
    if(ref){const slow=setTimeout(()=>{if(saving)setStatus('salvando… (está demorando, aguarde)')},8000);try{await Promise.race([ref.set(data),new Promise((_,rej)=>setTimeout(()=>rej({code:'demorou demais'}),90000))])}finally{clearTimeout(slow)}lastRaw=canon(data);base=data}
    else{try{localStorage.setItem('painel-da-vida',JSON.stringify(data))}catch(e){}}
    dbg('principal salvo em '+(Date.now()-t0)+'ms');
    if(seq===saveSeq){dirty=false;if(ref){setStatus('salvo ✓');savedPill()}else setStatus('sem conexão com o banco · salvo só neste aparelho')}
    saveFail=0;UNDO.length=0;
  }catch(e){dbg('principal FALHOU: '+((e&&(e.code||e.message))||'erro'));setStatus('não salvou: '+((e&&(e.code||e.message))||'erro')+' · toque para repetir');if(++saveFail<=3)setTimeout(save,4000);else{saveFail=0;undoPending();dirty=false;setStatus('não salvou · desfiz na tela')}}
  saving=false;
  if(dirty&&!saveT)saveT=setTimeout(runSave,50);
}
function save(){dirty=true;saveSeq++;clearTimeout(saveT);lastSaveAt=Date.now();setStatus('salvando…');saveT=setTimeout(runSave,300)}

/* ---------- agenda (Google Agenda) ---------- */
function parseAgenda(res){
  let p=res&&res.payload; if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p=null}}
  const evs=(p&&p.events)||[];
  return evs.map(e=>{const s=e.start||{};const allDay=!!s.date;
    const d=allDay?null:new Date(s.dateTime);
    return {k:allDay?String(s.date).slice(0,10):ymd(d),t:allDay?'':d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
      title:e.summary||'(sem título)',allDay,ms:allDay?0:d.getTime()}}).sort((a,b)=>(b.allDay-a.allDay)||(a.ms-b.ms));
}
async function initAgenda(){
  let mcp=null; try{mcp=window.claude&&await window.claude.use('mcp')}catch(e){mcp=null}
  if(!mcp){ui.agenda={state:'off',events:[]};if(view==='visao'&&!editing())render();return}
  ui.mcp=mcp;
  const st=today(), en=addDays(st,8);
  ui.agendaInput={startTime:ymd(st)+'T00:00:00',endTime:ymd(en)+'T00:00:00',orderBy:'startTime',pageSize:100};
  try{
    mcp.watchTool('Google Calendar','list_events',ui.agendaInput,ev=>{
      if(ev.type==='data')ui.agenda={state:'ok',events:parseAgenda(ev.result)};
      else ui.agenda={state:'err',code:ev.error&&ev.error.code,events:[]};
      if(view==='visao'&&!editing())render();
    },{refetchInterval:300000});
  }catch(e){ui.agenda={state:'err',code:'upstream_error',events:[]}}
}
function agendaAllow(){
  if(!ui.mcp||!ui.agendaInput)return;
  ui.agenda={state:'loading',events:[]};render();
  ui.mcp.callTool('Google Calendar','list_events',ui.agendaInput,{cache:false})
    .then(r=>{ui.agenda={state:'ok',events:parseAgenda(r)};render()})
    .catch(e=>{ui.agenda={state:'err',code:e&&e.code,events:[]};render()});
}
function vAgenda(){
  const A=ui.agenda;
  let body='';
  if(A.state==='loading')body='<p class="empty">Carregando sua agenda…</p>';
  else if(A.state==='off')body='<p class="empty">A agenda aparece quando você abre o painel dentro do Claude.</p>';
  else if(A.state==='err'){
    const c=A.code;
    if(c==='needs_reauth'||c==='server_not_connected'||c==='selection_required')body='<p class="empty">Conecte o Google Agenda no Claude, em Configurações, Conectores.</p>';
    else body=`<p class="empty">Permita que o painel leia seu Google Agenda para mostrar seus compromissos.</p><button class="btn" style="--c:var(--c-mente)" data-act="agenda-allow">Permitir Google Agenda</button>`;
  }else{
    const by={};A.events.forEach(e=>{(by[e.k]=by[e.k]||[]).push(e)});
    const days=[];for(let i=0;i<7;i++){const d=addDays(today(),i);days.push(d)}
    body='<div class="agenda">'+days.map((d,i)=>{
      const k=ymd(d), list=by[k]||[];
      const lab=i===0?'Hoje':i===1?'Amanhã':d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'numeric'});
      const shown=list.slice(0,6), more=list.length-shown.length;
      return `<div><div class="dayhd ${i===0?'today':''}">${esc(lab)}</div>${shown.length?shown.map(e=>`<div class="ev"><span class="mono">${e.allDay?'dia todo':e.t}</span><span>${esc(e.title)}</span></div>`).join(''):'<p class="empty" style="margin:0">Nada marcado.</p>'}${more>0?`<div class="mono" style="margin-top:4px">+${more} no Google Agenda</div>`:''}</div>`}).join('')+'</div>';
  }
  return card('Sua agenda','Próximos 7 dias · vem direto do Google Agenda',body,'wide');
}

/* ---------- datas e cálculos ---------- */
function weekCount(mon){let c=0;for(let i=0;i<7;i++)if(S.treinos[ymd(addDays(mon,i))])c++;return c}
function daysElapsed(){return ((today().getDay()+6)%7)+1}
function streak(){let d=today(),n=0;const ok=x=>(S.paginas[ymd(x)]||0)>=S.metaPag;
  if(!ok(d))d=addDays(d,-1); while(ok(d)){n++;d=addDays(d,-1)} return n}
function sonoMedia(){const mon=monday(today());let s=0,n=0;
  for(let i=0;i<7;i++){const v=S.sono[ymd(addDays(mon,i))];if(v>0){s+=v;n++}} return n?s/n:0}
const curKey=()=>{const t=today();return t.getFullYear()+'-'+pad(t.getMonth()+1)};
function mesDefault(k){return {ganhos:+S.financas.salario||0,tetos:TETO_BASE.map(([nome,teto])=>({nome,teto,gasto:0}))}}
function getMes(k,create){const f=S.financas;if(!f.mes[k]&&create)f.mes[k]=mesDefault(k);return f.mes[k]||null}
function mesView(k){return getMes(k)||mesDefault(k)}
function mesSoma(k){const m=mesView(k);return {ganhos:+m.ganhos||0,gasto:m.tetos.reduce((a,t)=>a+(+t.gasto||0),0),teto:m.tetos.reduce((a,t)=>a+(+t.teto||0),0),over:m.tetos.filter(t=>t.teto>0&&t.gasto>t.teto).length}}
function financeTotals(){const f=S.financas,m=mesSoma(curKey());
  const mensal=f.metas.reduce((a,x)=>a+(+x.mensal||0),0);
  return {teto:m.teto,gasto:m.gasto,mensal,over:m.over,sobra:(+f.salario||0)-TETO_BASE.reduce((a,t)=>a+t[1],0)}}
function projMedia(){const p=S.carreira.projetos;return p.length?p.reduce((a,x)=>a+(+x.pct||0),0)/p.length:0}
function crcSessions(){const o=[];(S.crc.aulas||[]).forEach(a=>{o.push({d:a.seg,t:a.segT,n:a.n,cg:true});o.push({d:a.qua,t:a.quaT,n:a.n,cg:false})});return o}
function crcWeek(){const mon=ymd(monday(today()));const l=S.crc.aulas||[];return l.find(a=>a.seg===mon)||null}
function facWeek(){const mon=monday(today());return [1,3].map(i=>ymd(addDays(mon,i)))}
function skinPct(d){const h=S.beleza.habitos;if(!h.length)return 0;const m=S.beleza.skin[d]||{};return h.filter(x=>m[x.id]).length/h.length*100}
function skin7(){let s=0;for(let i=0;i<7;i++)s+=skinPct(ymd(addDays(today(),-i)));return s/7}
function oleoSemana(){const mon=monday(today());let n=0;for(let i=0;i<7;i++)if(S.beleza.oleo[ymd(addDays(mon,i))])n++;return n}
function luaInfo(){const ds=Object.keys(S.beleza.lua).filter(d=>S.beleza.lua[d]).sort();if(!ds.length)return {last:null,next:null,left:null};
  const last=ds[ds.length-1],next=ymd(addDays(parse(last),15));return {last,next,left:Math.round((parse(next)-today())/864e5)}}
function pesoAtual(){const ds=Object.keys(S.corpo.peso).filter(d=>S.corpo.peso[d]>0).sort();return ds.length?{d:ds[ds.length-1],v:S.corpo.peso[ds[ds.length-1]]}:{d:S.corpo.inicioData,v:S.corpo.inicio}}
function corpoPlan(){const C=S.corpo,ini=parse(C.inicioData),ano=parse(C.anoData);
  const d1=(ano-ini)/864e5,post=+C.ritmoPos||0.5;
  const semFinal=Math.max(0,(C.metaAno-C.metaFinal)/post);
  const fim=addDays(ano,Math.round(semFinal*7));
  const planW=d=>{const t=(d-ini)/864e5;if(t<=d1)return C.inicio-(C.inicio-C.metaAno)*Math.max(0,t)/d1;return Math.max(C.metaFinal,C.metaAno-(post/7)*(t-d1))};
  return {ini,ano,d1,perSem:(C.inicio-C.metaAno)/(d1/7),fim,planW,post}}
/* teologia */
function bibOrder(){const idx=BIBLIA.map((_,i)=>i);if(S.teo.ordem==='nt')return idx.filter(i=>BIBLIA[i][2]==='NT').concat(idx.filter(i=>BIBLIA[i][2]==='AT'));return idx}
function teoNext(n){let left=n;const out=[];for(const i of bibOrder()){const b=BIBLIA[i],done=(S.teo.prog||{})[b[0]]||0;if(done>=b[1])continue;
  const take=Math.min(left,b[1]-done);out.push({nome:b[0],a:done+1,b:done+take});left-=take;if(left<=0)break}return out}
const refTxt=a=>a.map(r=>r.nome+' '+(r.a===r.b?r.a:r.a+'–'+r.b)).join(' e ');
function teoTotals(){let t=0,l=0;BIBLIA.forEach(b=>{t+=b[1];l+=Math.min(b[1],(S.teo.prog||{})[b[0]]||0)});return {t,l}}
function teoHoje(){return (S.teo.log||[]).filter(x=>x.d===ymd(today()))}
function teoStreak(){const ds=new Set((S.teo.log||[]).map(x=>x.d));let d=today(),n=0;if(!ds.has(ymd(d)))d=addDays(d,-1);while(ds.has(ymd(d))){n++;d=addDays(d,-1)}return n}
function pillars(){
  const el=daysElapsed(), mon=monday(today()), cnt=weekCount(mon);
  const sm=sonoMedia(), ft=financeTotals(), sk=skin7();
  let hairOk=true;for(let i=0;i<el;i++){if(WEEKPLAN[i][0]==='Natação'&&!S.beleza.cabelo[ymd(addDays(mon,i))])hairOk=false}
  const aw=crcWeek(); let crcTxt='',crcOk=true;
  if(aw){const dn=[aw.seg,aw.qua].filter(d=>S.crc.feitas[d]).length;crcTxt='CRC '+dn+'/2 da semana';crcOk=[aw.seg,aw.qua].every(d=>d>ymd(today())||S.crc.feitas[d])}
  const fw=facWeek(),fd=fw.filter(d=>S.facDed[d]).length,facOk=fw.every(d=>d>ymd(today())||S.facDed[d]);
  return {
    saude:{ok:cnt>=Math.floor(S.metaTreinos*el/7)&&cnt>0,txt:cnt+'/'+S.metaTreinos+' treinos · '+kg(pesoAtual().v)+' kg'},
    sono:{ok:sm>0&&sm>=S.metaSono-0.5,txt:sm?'média de '+num1(sm)+'h por noite':'sem registros ainda'},
    beleza:{ok:sk>=70&&hairOk,txt:'skincare '+Math.round(sk)+'% na semana · óleo '+oleoSemana()+'/1'},
    estudo:{ok:crcOk&&facOk&&!crcAtrasadas().length,txt:(crcTxt?crcTxt+' · ':'')+'faculdade '+fd+'/2'+(crcAtrasadas().length?' · '+crcAtrasadas().length+' CRC atrasadas':'')},
    financas:{ok:ft.gasto>0&&ft.gasto<=ft.teto,txt:ft.over?ft.over+' categorias acima do teto':(ft.gasto?'tudo dentro do teto':'sem lançamentos no mês')},
    carreira:{ok:S.carreira.projetos.length>0&&projMedia()>=50,txt:S.carreira.passos.length?S.carreira.passos.filter(p=>p.done).length+'/'+S.carreira.passos.length+' passos concluídos':'sem passos ainda'}
  };
}

/* ---------- peças de interface ---------- */
const bar=(p,cls)=>`<div class="bar ${cls||''}"><i style="width:${clamp(p,0,100)}%"></i></div>`;
const card=(t,sub,body,cls)=>`<section class="card ${cls||''}"><h3>${t}</h3>${sub?`<p class="sub">${sub}</p>`:'<div style="height:10px"></div>'}${body}</section>`;
function chart(vals,labels,meta,hiLast){
  const max=Math.max(meta||0,...vals,1)*1.15;
  const bars=vals.map((v,i)=>`<div class="b ${hiLast&&i===vals.length-1?'hi':''}" style="height:${(v/max)*100}%" title="${v}"></div>`).join('');
  const goal=meta?`<div class="goal" style="bottom:${(meta/max)*100}%"></div>`:'';
  return `<div class="chart">${goal}${bars}</div><div class="lbls">${labels.map(l=>`<span>${l}</span>`).join('')}</div>`}
function svgLine(o){const W=640,H=240,L=44,R=12,T=12,B=26;
  const X=x=>L+(x-o.xmin)/((o.xmax-o.xmin)||1)*(W-L-R),Y=y=>T+(1-(y-o.ymin)/((o.ymax-o.ymin)||1))*(H-T-B);
  let s=`<svg class="chartsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'gráfico')}">`;
  (o.yt||[]).forEach(y=>{s+=`<line class="gx" x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}"/><text class="tx" x="${L-6}" y="${Y(y)+3}" text-anchor="end">${o.yf?o.yf(y):y}</text>`});
  (o.xt||[]).forEach(([x,l])=>{s+=`<text class="tx" x="${X(x)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  o.series.forEach(se=>{if(se.pts.length>1)s+=`<polyline class="${se.kind==='plan'?'l-plan':'l-real'}" points="${se.pts.map(([x,y])=>X(x)+','+Y(y)).join(' ')}"/>`;
    if(se.dots)se.pts.forEach(([x,y])=>{s+=`<circle class="pt" cx="${X(x)}" cy="${Y(y)}" r="4"/>`})});
  return s+'</svg>'}
const addForm=(name,fields,btn)=>`<form data-form="${name}" class="row" style="margin-top:12px;flex-wrap:wrap">${fields}<button class="btn" type="submit">${btn}</button></form>`;
const fld=(id,ph,extra)=>`<input id="${id}" placeholder="${ph}" aria-label="${ph}" style="flex:1 1 140px" ${extra||''}>`;
const shell=(c,eyebrow,title,lead,body)=>`<div style="--c:var(${c})"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p class="lead">${lead}</p>${body}</div>`;
const tabs=(v,items)=>`<div class="tabs">${items.map(([id,l,e])=>`<button data-act="sub" data-view="${v}" data-sub="${id}" aria-pressed="${ui.sub[v]===id}">${e?`<span class="em">${e}</span>`:''}${l}</button>`).join('')}</div>`;
function verseOfDay(){const d=today();return VERSOS[Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)%VERSOS.length]}
function vinheta(){const g=S.teo.grat||[];if(!g.length)return '';
  let e=g.find(x=>x.id===ui.vigId);
  if(!e){const pool=g.filter(x=>x.d<ymd(today()));const p=pool.length?pool:g;e=p[Math.floor(Math.random()*p.length)];ui.vigId=e.id}
  const dias=Math.round((today()-parse(e.d))/864e5);
  return `<div class="vig"><div class="eyebrow" style="--c:var(--c-teo)">✿ Lembra?</div><q>${esc(e.t)}</q><span class="mono">${dias<=0?'hoje':dias===1?'ontem':'há '+dias+' dias'} você foi grata por isso</span><div><button class="btn ghost" data-act="vig-outra">outra lembrança</button></div></div>`}

function vCrc(){

function treinoStats(k){const o={n:0,por:{},prova:0,plan:0,planAte:0},t0=ymd(today()),nd=diasNoMes(k);

    if(S.wellhub[ds])o.prova++}

const FERIADOS=new Set(['2026-01-01','2026-04-03','2026-04-21','2026-05-01','2026-06-04','2026-09-07','2026-10-12','2026-11-02','2026-11-15','2026-11-20','2026-12-25','2027-01-01','2027-03-26','2027-04-21','2027-05-01','2027-05-27','2027-09-07','2027-10-12','2027-11-02','2027-11-15','2027-11-20','2027-12-25']);
const diaUtil=d=>{const w=d.getDay();return w!==0&&w!==6&&!FERIADOS.has(ymd(d))};
function quintoUtil(k){let d=new Date(+k.slice(0,4),+k.slice(5,7)-1,1),n=0;for(let i=0;i<40;i++){if(diaUtil(d)){n++;if(n===5)return ymd(d)}d=addDays(d,1)}return k+'-07'}
const nextKey=k=>{let y=+k.slice(0,4),m=+k.slice(5,7)+1;if(m>12){m=1;y++}return y+'-'+pad(m)};
const prevKey=k=>{let y=+k.slice(0,4),m=+k.slice(5,7)-1;if(m<1){m=12;y--}return y+'-'+pad(m)};
const lastDay=k=>k+'-'+pad(diasNoMes(k));
const addMes=(s,n)=>{const d=parse(s);const t=new Date(d.getFullYear(),d.getMonth()+n,1);const nd=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return ymd(new Date(t.getFullYear(),t.getMonth(),Math.min(d.getDate(),nd)))};
const F2=()=>S.fin2;
const extDone=k=>{const b=F2().ext.bancos,o=(F2().ext.ok||{})[k]||{};return b.length>0&&b.every(x=>o[x.id])};
function extCiclo(){const ts=ymd(today()),cur=curKey(),desde=F2().ext.desde||'2026-11';
  for(let k=desde;k<=cur;k=nextKey(k)){if(!extDone(k))return {k,due:quintoUtil(k),ref:prevKey(k),pend:true}}
  let nk=cur<desde?desde:(ts<quintoUtil(cur)?cur:nextKey(cur));
  return {k:nk,due:quintoUtil(nk),ref:prevKey(nk),pend:false}}
const diasAte=s=>Math.round((parse(s)-today())/864e5);

function rotBanner(){const r=rotInfo();
  const txt=r.antes?`Rotina de leitura começa ${r.falta===1?'<b>amanhã</b>':'em <b>'+r.falta+' dias</b>'} (${dmy(r.ini)})`:`Dia <b>${r.dia}</b> da nova rotina de leitura`;

function prioPlan(b){const t=today(),ini=parse(b.inicio||ymd(t)),fim=parse(b.prazo),hoje=t<ini?ini:t;
  const diasTot=Math.round((fim-ini)/864e5)+1,diasRest=Math.max(1,Math.round((fim-hoje)/864e5)+1),at=+b.atual||0;
  const rest=Math.max(0,b.total-at),ini0=Math.max(0,at-(t>=ini?histHoje(b):0)),need=Math.ceil(Math.max(0,b.total-ini0)/diasRest);
  const dia=t<ini?0:Math.round((t-ini)/864e5)+1,deveria=t<ini?0:Math.min(b.total,Math.ceil(b.total*dia/diasTot));
  return {diasTot,diasRest,rest,need,dia,deveria,atraso:Math.max(0,deveria-at),ini,fim,comecou:t>=ini,de:ini0+1,ate:Math.min(b.total,ini0+need)}}
function prioBloco(){const l=S.leit.livros.filter(b=>b.prio&&b.prazo&&b.st!=='Concluído');if(!l.length)return '';

        if((tent||0)<3){setTimeout(()=>putM(id,(tent||0)+1),3000);toast('Tentando salvar de novo…')}
        else{const v=find(S.cultura,id);if(v&&MK.mp[id]&&MK.mp[id].t===cur.t){delete MK.mp[id];const o=MK.m[id];v.feito=o?!!o.f:!cur.f;v.dv=o?(o.d||''):'';render()}toast('Não salvou ('+((e&&(e.code||e.message))||'erro')+'). Desfiz a marcação na tela; tente de novo.')}
      }
    });
  }
  const lastTap={};
  const baseT=ACTS['cul-toggle'],baseN=ACTS['cul-nota'];
  ACTS['cul-toggle']=function(d,el){
    const now=Date.now();
    
    lastTap[d.id]=now;
    if(!MK.ref)return baseT(d,el);
    const v=find(S.cultura,d.id);if(!v)return false;
    v.feito=(d.to!=null&&d.to!=='')?d.to==='1':!v.feito;dbg('toggle '+d.id+' => '+(v.feito?'assistido':'nao'));v.dv=v.feito?tkey():'';ui.culJust=v.feito?d.id:null;MK.mp[d.id]={f:v.feito?1:0,n:+v.nota||0,d:v.dv,t:Date.now()};
    toast((v.feito?'Assistido: ':'Desmarcado: ')+v.nome+' · salvando…');
    render();putM(d.id);return false;
  };
  ACTS['cul-nota']=function(d,el){
    if(!MK.ref)return baseN(d,el);
    const v=find(S.cultura,d.id);if(!v)return false;
    v.nota=(v.nota===+d.n)?0:+d.n;MK.mp[d.id]={f:v.feito?1:0,n:+v.nota||0,d:v.dv||'',t:Date.now()};
    render();putM(d.id);return false;
  };
  (async()=>{try{
    const db2=window.claude&&await window.claude.use('db');if(!db2)return;
    MK.ref=db2.doc('painel/marcas');
    MK.ref.onSnapshot(s=>{
      MK.exists=!!s.exists;if(!s.exists)return;
      const d=s.data()||{};const m=d.cultura||{};const j=canon(m);
      if(j===MK.last)return;
      MK.last=j;MK.m=JSON.parse(JSON.stringify(m));applyM();dbg('marcas recebidas');
      if(!editing())render();
    },()=>{dbg('marcas: erro de leitura')});
  }catch(e){}})();
  /* plano B: se o aparelho não entregar o "click", o toque (pointerup) faz o mesmo */
  let pd=null;
  document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.cul-t');pd=b?{b,x:e.clientX,y:e.clientY}:null},true);
  document.addEventListener('pointerup',e=>{
    const o=pd;pd=null;if(!o)return;const b=e.target.closest&&e.target.closest('.cul-t');
    if(b!==o.b||Math.abs(e.clientX-o.x)>10||Math.abs(e.clientY-o.y)>10)return;
    const id=b.dataset.id;
    setTimeout(()=>{if(lastTap[id]&&Date.now()-lastTap[id]<500)return;
      const r=ACTS['cul-toggle'](b.dataset,b);if(r!==false){save();render()}},260);
  },true);
  /* selo de versão: toque para ver o diagnóstico */
  const ch=document.getElementById('status');
  if(ch&&!document.getElementById('ver')){
    const s=document.createElement('button');s.id='ver';s.type='button';s.textContent='v25 · web';s.setAttribute('aria-label','Versão 25. Toque para ver o diagnóstico de salvamento');
    ch.insertAdjacentElement('afterend',s);
    s.addEventListener('click',()=>{
      let p=document.getElementById('dbgp');
      if(p){p.remove();return}
      p=document.createElement('pre');p.id='dbgp';
      p.textContent='DIAGNÓSTICO v25 (toque no v25 para fechar)\nstatus: '+document.getElementById('status').textContent+'\nbanco: '+(ref?'conectado':'sem banco (neste aparelho)')+'\npendentes: '+Object.keys(MK.mp).join(',')+'\n---\n'+DBG.slice(-40).join('\n');
      document.body.appendChild(p);
    });
  }
})();

/* v19: registrar página automaticamente */
(function(){
  const PG={base:{},cred:{},t:null};
  const pctOf=b=>b.total?Math.max(0,Math.min(100,(+b.atual||0)/b.total*100)):0;
  function live(b){
    const pc=pctOf(b),rest=Math.max(0,b.total-(+b.atual||0));
    document.querySelectorAll('[data-pgb="'+b.id+'"]').forEach(box=>{
      const set=(s,t)=>{const e=box.querySelector(s);if(e)e.textContent=t};
      set('.pgn',b.atual||0);set('.pcbig',Math.round(pc)+'%');set('.pgbox .n',b.atual||0);set('.pgbox .pc',Math.round(pc)+'%');set('.pgpc',Math.round(pc)+'%');
      const bi=box.querySelector('.bar i');if(bi)bi.style.width=pc+'%';
      const f=box.querySelector('.pgfalta');if(f)f.innerHTML=faltaHtml(b);
      const m=box.querySelector('.pgmini');if(m)m.textContent='de '+b.total+' · faltam '+rest+' ('+Math.max(0,100-Math.round(pc))+'%)';
    });
  }
  function reg(id,v){
    const b=find(S.leit.livros,id);if(!b)return null;
    v=Math.max(0,Math.min(+b.total||0,Math.floor(v)));
    const k=tkey();
    if(PG.base[id]==null){PG.base[id]=+b.atual||0;PG.cred[id]=0}
    const credit=Math.max(0,v-PG.base[id]),d=credit-PG.cred[id];
    b.atual=v;PG.cred[id]=credit;
    if(d){S.paginas[k]=Math.max(0,(S.paginas[k]||0)+d);b.hist=b.hist||{};b.hist[k]=Math.max(0,(b.hist[k]||0)+d)}
    if(credit>0){S.leit.pres[k]=1;S.leit.livroHoje={d:k,id:b.id}}
    if(v>=b.total)b.st='Concluído';else if(b.st!=='Lendo')b.st='Lendo';
    return b;
  }
  document.addEventListener('input',e=>{
    const el=e.target;if(!el||!el.dataset||!el.dataset.pgauto)return;
    if(el.value==='')return;const v=parseFloat(String(el.value).replace(',','.'));if(isNaN(v)||v<0)return;
    const b=reg(el.dataset.pgauto,v);if(!b)return;
    if(+el.value>b.total)el.value=b.total;
    live(b);save();
    clearTimeout(PG.t);PG.t=setTimeout(()=>window.__toast&&window.__toast('Página '+b.atual+' registrada · '+(b.total-b.atual>0?Math.max(0,100-Math.round(pctOf(b)))+'% faltam':'livro concluído')),1100);
  });
  document.addEventListener('change',e=>{
    const el=e.target;if(!el||!el.dataset||!el.dataset.pgauto)return;
    delete PG.base[el.dataset.pgauto];delete PG.cred[el.dataset.pgauto];
    setTimeout(()=>{if(!editing())render()},60);
  });
  document.addEventListener('keydown',e=>{const el=e.target;if(e.key==='Enter'&&el&&el.dataset&&el.dataset.pgauto){e.preventDefault();el.blur()}});
})();

/* v20: formulários e cliques à prova de falhas + registro técnico */
(function(){
  const GHOST=600,L={x:-99,y:-99,t:0};
  const desc=el=>{try{return el.tagName.toLowerCase()+(el.dataset&&el.dataset.act?'['+el.dataset.act+(el.dataset.id?':'+el.dataset.id:'')+']':'')+(el.className&&typeof el.className==='string'?'.'+el.className.split(' ')[0]:'')}catch(e){return '?'}};
  function runForm(f){const fn=FORMS[f.dataset.form];if(!fn)return;let r;
    try{r=fn(f)}catch(err){dbg('ERRO no formulário '+f.dataset.form+': '+(err&&err.message));return}
    dbg('formulário '+f.dataset.form+' → '+(r===false?'recusado (vazio ou inválido)':'ok'));
    if(r===false)return;save();render()}
  window.addEventListener('click',e=>{
    const t=e.target;if(!t||!t.closest)return;
    const el=t.closest('[data-act],button,summary,a');
    const now=Date.now(),gap=now-L.t,dist=Math.hypot(e.clientX-L.x,e.clientY-L.y);
    if(el&&e.detail>0&&gap<1200&&dist<14){
      const block=gap<GHOST;dbg('clique repetido gap='+gap+'ms '+desc(el)+(block?' BLOQUEADO':''));
      if(block){e.stopImmediatePropagation();e.preventDefault();return}}
    if(el){L.x=e.clientX;L.y=e.clientY;L.t=now;dbg('clique '+desc(el))}
    const sb=t.closest('form[data-form] button:not([type=button]):not([type=reset])');
    if(sb){e.preventDefault();e.stopImmediatePropagation();runForm(sb.closest('form[data-form]'))}
  },true);
  window.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||e.isComposing)return;const t=e.target;
    if(!t||t.tagName!=='INPUT'||t.type==='checkbox'||t.type==='button')return;
    const f=t.closest&&t.closest('form[data-form]');if(!f)return;e.preventDefault();runForm(f)},true);
  window.addEventListener('error',ev=>{try{dbg('ERRO JS: '+ev.message+' (linha '+ev.lineno+')')}catch(e){}});
  window.addEventListener('unhandledrejection',ev=>{try{dbg('ERRO promessa: '+((ev.reason&&(ev.reason.code||ev.reason.message))||ev.reason))}catch(e){}});
  /* confirmar antes de remover */
  const armed={};
  ['cul-del','kb-del'].forEach(a=>{const base=ACTS[a];if(!base)return;
    ACTS[a]=function(d,el){const k=a+d.id;
      if(armed[k]&&Date.now()-armed[k]<4000){delete armed[k];return base(d,el)}
      armed[k]=Date.now();if(window.__toast)window.__toast('Toque de novo no × para remover');return false}});
  /* metas: total reservado salva sozinho */
  const MA={t:null,base:{}};
  const mLive=(el,m)=>{const art=el.closest('.mc');if(!art)return;const c=metaCalc(m);
    const v=art.querySelector('.mc-v');if(v)v.textContent=brl(c.g);const p=art.querySelector('.pill');if(p)p.textContent=Math.round(c.p)+'%';const i=art.querySelector('.tr i');if(i)i.style.width=c.p+'%'};
  document.addEventListener('input',e=>{const el=e.target;if(!el||!el.dataset||!el.dataset.mauto)return;
    const m=find(S.financas.metas,el.dataset.mauto);if(!m)return;
    if(MA.base[m.id]==null)MA.base[m.id]=+m.guardado||0;
    const raw=String(el.value).replace(',','.'),v=raw===''?0:parseFloat(raw);if(isNaN(v)||v<0)return;
    m.guardado=Math.round(v*100)/100;mLive(el,m);save();dbg('meta '+m.id+' = '+m.guardado);
    clearTimeout(MA.t);MA.t=setTimeout(()=>{window.__toast&&window.__toast('Reservado em '+m.nome+': '+brl(m.guardado))},1000)});
  document.addEventListener('change',e=>{const el=e.target;if(!el||!el.dataset||!el.dataset.mauto)return;
    const m=find(S.financas.metas,el.dataset.mauto);if(!m)return;
    const dl=Math.round(((+m.guardado||0)-(MA.base[m.id]||0))*100)/100;delete MA.base[m.id];
    if(dl>0){m.log=(m.log||[]).concat([{d:tkey(),v:dl}]).slice(-20);save()}
    setTimeout(()=>{if(!editing())render()},60)});
  document.addEventListener('keydown',e=>{const el=e.target;if(e.key==='Enter'&&el&&el.dataset&&el.dataset.mauto){e.preventDefault();el.blur()}});
  /* registro técnico no banco (para eu conseguir ver o que acontece no aparelho) */
  let dr=null,lastN=0,pushing=false;
  (async()=>{try{const d2=window.claude&&await window.claude.use('db');if(d2)dr=d2.doc('painel/diag')}catch(e){}})();
  setInterval(async()=>{if(!dr||pushing||DBGN===lastN)return;pushing=true;const n=DBGN;
    try{await dr.set({v:'v25',ua:navigator.userAgent,vw:innerWidth+'x'+innerHeight,pr:window.devicePixelRatio||1,touch:('ontouchstart' in window)||navigator.maxTouchPoints>0,at:Date.now(),log:DBG.slice(-140)});lastN=n}catch(e){}
    pushing=false},4000);
  dbg('página aberta v25');
})();

/* v21: excluir com confirmação visível, adicionar com aviso */
ACTS['cul-del']=function(d){
  if(ui.culArm===d.id){S.cultura=S.cultura.filter(v=>v.id!==d.id);ui.culArm=null;window.__toast&&window.__toast('Item excluído');return}
  ui.culArm=d.id;render();setTimeout(()=>{if(ui.culArm===d.id){ui.culArm=null;render()}},4000);return false};
{const _ca=FORMS['cul-add'];FORMS['cul-add']=function(f){
  const nm=val('cu-n');const r=_ca(f);
  if(r===false){window.__toast&&window.__toast('Digite o título para adicionar');return false}

/* v24: toques idempotentes, trava contra toque duplo, correção de estado e desfazer se falhar */
(function(){
  const TOG=['fac-toggle','passo-toggle','ev-toggle','acao-toggle','via-toggle','cul-toggle','dois-toggle','ct-rec','fl-imp','mer-ok','crc-toggle','ct-toggle','ext-toggle','ctask','roupa','skin','fac-ded'];
  const lock={};
  const keyOf=(a,d)=>a+'|'+[d.id,d.k,d.d,d.i,d.h,d.t].map(x=>x==null?'':x).join('|');
  const sel=(a,d)=>'[data-act="'+a+'"]'+['id','k','d','i','h','t'].filter(x=>d[x]!=null).map(x=>'[data-'+x+'="'+String(d[x]).replace(/"/g,'\\"')+'"]').join('');
  const stateOf=el=>!el?null:(el.type==='checkbox'?!!el.checked:el.hasAttribute('aria-pressed')?el.getAttribute('aria-pressed')==='true':null);
  TOG.forEach(a=>{const base=ACTS[a];if(!base)return;
    ACTS[a]=function(d,el){
      const k=keyOf(a,d),now=Date.now();
      if(lock[k]&&now-lock[k]<800){dbg('toque duplicado ignorado '+a+' '+(d.id||d.d||''));setTimeout(render,0);return false}
      lock[k]=now;
      const desired=d.to!=null&&d.to!==''?d.to==='1':(el?(el.type==='checkbox'?!!el.checked:el.hasAttribute&&el.hasAttribute('aria-pressed')?el.getAttribute('aria-pressed')!=='true':null):null);
      const r=base(d,el);
      if(a!=='cul-toggle')UNDO.push(()=>{lock[k]=0;base(d,el)});
      setTimeout(()=>{let n=null;try{n=document.querySelector(sel(a,d))}catch(e){}
        const st=stateOf(n);
        if(desired!=null&&st!=null&&st!==desired){dbg('estado corrigido em '+a+' '+(d.id||d.d||'')+' (tela≠dados)');const r2=base(d,n);if(r2!==false){save();render()}}
        else dbg(a+' '+(d.id||d.d||'')+' → '+(st?'marcado':'desmarcado'));
      },30);
      return r};
  });
})();

try{const h=location.hash.slice(1);if(RENDER[h]||ALIAS[h])setView(h)}catch(e){}
init();
